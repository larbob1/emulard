name: AI1 isolated AI2 footprint bounds gate

on:
  pull_request:
    branches: [dev/performance-phase6]
    paths:
      - 'probes/ai2_footprint_bounds.rs'
      - 'tools/validate_ai1_footprint_bounds_gate.py'
      - '.github/workflows/ai1-footprint-bounds-gate.yml'

permissions:
  contents: read

jobs:
  footprint-bounds-gate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dev/performance-phase6-ai1-footprint-bounds-gate'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify candidate checkout
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne '${{ github.event.pull_request.head.sha }}') { throw 'candidate checkout mismatch' }
          Write-Output "candidate_head=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check runner syntax
        run: python -m py_compile tools/validate_ai1_footprint_bounds_gate.py
      - name: Query descriptor extents and retain numeric receipts
        run: python tools/validate_ai1_footprint_bounds_gate.py
