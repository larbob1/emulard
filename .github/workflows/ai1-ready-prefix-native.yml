name: AI1 isolated ready-prefix registration parity

on:
  pull_request:
    branches: [dev/performance-phase6]
    paths:
      - 'tools/validate_ai1_ready_prefix.py'
      - '.github/workflows/ai1-ready-prefix-native.yml'

permissions:
  contents: read

jobs:
  ready-prefix-native:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dev/performance-phase6-ai1-ready-prefix-native'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne '${{ github.event.pull_request.head.sha }}') { throw 'candidate checkout mismatch' }
          Write-Output "candidate_head=$actual"
      - name: Check out exact AI0 proposal
        uses: actions/checkout@v4
        with:
          ref: 036dec4dc4b6a012d2e860e1ae779b67f75719eb
          path: ai0-pr71
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check runner syntax
        run: python -m py_compile tools/validate_ai1_ready_prefix.py
      - name: Compile and exercise exact registration loops with WARP
        run: python tools/validate_ai1_ready_prefix.py --proposal ai0-pr71
