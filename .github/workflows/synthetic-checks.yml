name: Synthetic compatibility checks

on:
  push:
    branches: [dev/compatibility-baseline]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patcher unit tests
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Shell syntax
        run: bash -n tools/preflight.sh
      - name: Native fixture
        run: |
          cmake -S probes -B build-probes -DCMAKE_BUILD_TYPE=Release
          cmake --build build-probes
          ctest --test-dir build-probes --output-on-failure
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build synthetic probes
        run: |
          cmake -S probes -B build-probes -A x64
          cmake --build build-probes --config Release
          ctest --test-dir build-probes -C Release --output-on-failure
      - name: Publish synthetic binaries only
        uses: actions/upload-artifact@v4
        with:
          name: emulard-synthetic-probes
          path: |
            build-probes/Release/abi_smoke.exe
            build-probes/Release/graphics_caps.exe
          if-no-files-found: error
          retention-days: 7
