name: AI1 owned dependent consumer gate

on:
  pull_request:
    branches: [dev/performance-phase6]
    paths:
      - 'probes/ai6_dependent_consumer.rs'
      - 'probes/ai6_dependent_consumer_host.rs'
      - 'tools/prepare_ai6_dependent_consumer.py'
      - 'tools/validate_ai1_dependent_consumer_native.py'
      - '.github/workflows/ai1-dependent-consumer-native.yml'

permissions:
  contents: read

jobs:
  dependent-consumer-native:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dev/performance-phase6-ai1-dependent-consumer-native'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify candidate checkout
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne '${{ github.event.pull_request.head.sha }}') { throw 'candidate checkout mismatch' }
          Write-Output "candidate_head=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check runner syntax
        run: python -m py_compile tools/validate_ai1_dependent_consumer_native.py
      - name: Exercise two exact positive whole-wait gates
        run: python tools/validate_ai1_dependent_consumer_native.py
