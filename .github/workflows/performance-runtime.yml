name: Paired-wave performance runtime validation

on:
  push:
    branches: ['dev/performance-phase6', 'dev/performance-phase6-cpu-trace-count-proof']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: paired-wave-runtime-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  paired-wave:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare, test and compile full paired-wave candidate
        run: python tools/ci_compile.py --paired-wave-refresh
