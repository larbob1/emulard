name: AI1 owned texture selection repair gate

on:
  pull_request:
    branches: [dev/performance-phase6]
    paths:
      - 'probes/ai2_texback_selection_repair.rs'
      - 'probes/ai2_texback_selection_observe.rs'
      - 'probes/ai2_texback_record_resource.rs'
      - 'docs/ai2-texback-selection-repair.md'
      - 'probes/ai2_texback_selection_repair_transform.py'
      - 'tools/prepare_ai2_selection_repair.py'
      - 'tools/validate_ai1_selection_repair_native.py'
      - '.github/workflows/ai1-selection-repair-native.yml'

permissions:
  contents: read

jobs:
  selection-repair-native:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dev/performance-phase6-ai1-selection-repair-native'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify candidate checkout
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne '${{ github.event.pull_request.head.sha }}') { throw 'candidate checkout mismatch' }
          Write-Output "candidate_head=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check runner syntax
        run: python -m py_compile tools/validate_ai1_selection_repair_native.py
      - name: Exercise twenty-four fixed counterparts and two stale-only regressions
        run: python tools/validate_ai1_selection_repair_native.py
