name: AI1 owned storage scratch parity gate

on:
  pull_request:
    branches: [dev/performance-phase6]
    paths:
      - 'probes/storage_scratch_native.rs'
      - 'tools/validate_ai1_storage_scratch_native.py'
      - '.github/workflows/ai1-storage-scratch-native.yml'

permissions:
  contents: read

jobs:
  storage-scratch-native:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dev/performance-phase6-ai1-storage-scratch-native'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify candidate checkout
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne '${{ github.event.pull_request.head.sha }}') { throw 'candidate checkout mismatch' }
          Write-Output "candidate_head=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check runner syntax
        run: python -m py_compile tools/validate_ai1_storage_scratch_native.py
      - name: Exercise four exact owned storage scratch parity gates
        run: python tools/validate_ai1_storage_scratch_native.py
