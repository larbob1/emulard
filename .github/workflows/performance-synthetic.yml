name: Performance candidate synthetic tests

on:
  push:
    branches: ['dev/performance-phase*']
  pull_request:
    branches: ['dev/performance-phase*', 'dev/compatibility-baseline']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patcher and reporting tests
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Standalone range gate tests
        run: |
          rustc --edition 2021 --test probes/range_gate.rs -o /tmp/emulard-range-gate-tests
          /tmp/emulard-range-gate-tests
      - name: Standalone exact placeholder hint tests
        run: |
          rustc --edition 2024 --test probes/placeholder_hint_tests.rs -o /tmp/emulard-placeholder-tests
          /tmp/emulard-placeholder-tests

      - name: Standalone physical logical accounting model
        run: |
          rustc --edition 2024 --test probes/physical_ledger_review.rs -o /tmp/emulard-physical-ledger-tests
          /tmp/emulard-physical-ledger-tests

      - name: Standalone coherent mapping publication model
        run: |
          rustc --edition 2024 --test probes/physical_publication_review.rs -o /tmp/emulard-physical-publication-tests
          /tmp/emulard-physical-publication-tests

      - name: Standalone actual mapping diagnostic producer
        run: |
          rustc --edition 2024 --test probes/mapping_diagnostic.rs -o /tmp/emulard-mapping-diagnostic-tests
          /tmp/emulard-mapping-diagnostic-tests

  portable-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/dev/performance-phase6' || github.head_ref == 'dev/performance-phase6' || github.ref == 'refs/heads/dev/performance-phase6-combined-playtest' || github.head_ref == 'dev/performance-phase6-combined-playtest' || github.ref == 'refs/heads/dev/performance-phase6-mapping-diagnostic-native' || github.head_ref == 'dev/performance-phase6-mapping-diagnostic-native' || github.ref == 'refs/heads/dev/performance-phase6-mapping-index-native' || github.head_ref == 'dev/performance-phase6-mapping-index-native'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned runtime source
        run: |
          if python tools/build_runtime.py "$RUNNER_TEMP/runtime" --paired-wave-refresh > "$RUNNER_TEMP/prepare.log" 2>&1; then
            echo "Pinned source prepared"
          else
            echo "Pinned source preparation failed"
            exit 1
          fi
      - name: Compile and test actual portable copy helpers
        run: |
          if python tools/check_copy_helpers.py "$RUNNER_TEMP/runtime" > "$RUNNER_TEMP/copy-tests.log" 2>&1; then
            grep -E '^Portable copy helper tests:|^running [0-9]+ tests|^test result:' "$RUNNER_TEMP/copy-tests.log"
          else
            grep -E '^error\[E[0-9]+\]|^test result:|^Portable copy helper validation failed' "$RUNNER_TEMP/copy-tests.log" || true
            exit 1
          fi
