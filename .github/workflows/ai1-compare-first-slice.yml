name: AI1 isolated first-slice native validation

on:
  pull_request:
    branches: [dev/performance-phase6]
    paths:
      - 'tools/validate_ai1_compare_first_slice.py'
      - 'tools/test_validate_ai1_compare_first_slice.py'
      - '.github/workflows/ai1-compare-first-slice.yml'

permissions:
  contents: read

jobs:
  isolated-first-slice:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dev/performance-phase6-ai1-compare-first-slice-validation'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact candidate checkout
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne '${{ github.event.pull_request.head.sha }}') { throw 'candidate checkout mismatch' }
          Write-Output "candidate_head=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate runner contract
        run: python tools/test_validate_ai1_compare_first_slice.py
      - name: Run isolated native regression and paired-wave checks
        run: python tools/validate_ai1_compare_first_slice.py
